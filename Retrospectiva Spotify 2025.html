<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <title>Retrospectiva Spotify 2025</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #191414;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #1DB954;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background-color: #1DB954;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        h2 {
            text-align: center;
            margin-top: 40px;
            color: #1DB954;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #e6f7ec;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Retrospectiva Spotify 2025</h1>

        <form>
            <label>Artista mais ouvido:</label>
            <input type="text" placeholder="Ex: Ebony">

            <label>Música mais ouvida:</label>
            <input type="text" placeholder="Ex: Kia">

            <label>Gênero mais escutado:</label>
            <input type="text" placeholder="Ex: Trap">

            <label>Minutos escutados no ano:</label>
            <input type="number" placeholder="Ex: 13350">

            <label>Artista revelação do ano:</label>
            <input type="text" placeholder="Ex: Duquesa">

            <label>Humor musical em 2025:</label>
            <select>
                <option>Animado</option>
                <option>Calmo</option>
                <option>Variado</option>
                <option>Triste</option>
            </select>

            <button class="btn" type="submit">Confirmar Retrospectiva</button>
        </form>

        <h2>Alterações</h2>

        <label>Descreva a alteração:</label>
        <input type="text" placeholder="Ex: minutos alterados para 15.000">

        <button class="btn">Confirmar Alteração</button>

        <table>
            <tbody><tr>
                <th>Item</th>
                <th>Alteração</th>
                <th>Ação</th>
            </tr>
            <tr>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>
        </tbody></table>

    </div>


</body></html>
